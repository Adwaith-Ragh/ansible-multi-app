---
- name: Create Employee Directory directory
  ansible.builtin.file:
    path: "{{ app_two_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  become: true

- name: Deploy Employee Directory website
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ app_two_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
  become: true
